name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: gen-sitemap.mjs dates each static page's <lastmod>
          # from git log. A shallow clone would stamp every page "today".
          fetch-depth: 0

      # Spec 104: build insight pages + sitemap.xml from content/posts.json on
      # every deploy, so a post added to the JSON always gets its page and its
      # sitemap entry. Idempotent: on committed inputs it changes nothing.
      # Node ships on ubuntu-latest; the scripts have no dependencies.
      - name: Generate insight pages and sitemap
        run: node scripts/gen-post-pages.mjs

      - name: Stage site (exclude non-site dirs)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='backend' \
            --exclude='agents' \
            --exclude='resend_mcp_server' \
            --exclude='node_modules' \
            --exclude='scripts' \
            --exclude='tests' \
            --exclude='_site' \
            ./ _site/

      # The resume lives in a folder in the repo (assets/img/resume.pdf) but is
      # published at the short URL /resume.pdf. A missing file fails the deploy.
      - name: Publish resume at /resume.pdf
        run: cp assets/img/resume.pdf _site/resume.pdf

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
