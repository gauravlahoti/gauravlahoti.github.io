# Both metrics below are CodeExecutionMetric (execution: local, the default)
# rather than the declarative LLMMetric / built-in managed metrics. Those
# managed paths were tried first and both proved broken against the live
# Vertex Evaluation Service as of agents-cli 1.2.1:
#   - LLMMetric's `judge_model` -> `autorater_model` resource-name resolution
#     rejects even the SDK's own documented example value ("gemini-2.5-flash")
#     with "Invalid autorater model resource name", regardless of --project.
#   - the built-in `multi_turn_tool_use_quality` metric returned a flat 0.0
#     score with 0.0 stdev across dissimilar cases despite complete trace data
#     — not a real quality signal.
# custom_function code below calls Gemini directly, fully bypassing the
# managed evaluation service. Runs local, in the CLI's own process.
#
# Grading calls Vertex AI directly on the `adk-mas-demo` GCP project (via
# ADC, google.genai.Client(vertexai=True, project="adk-mas-demo",
# location="global")) rather than the AI Studio free-tier API key the agent
# itself uses. Two prior approaches were tried and ruled out first:
#   - AI Studio API key: the free tier caps each model at 20
#     generate_content calls/day/project — 16 cases x 2 metrics = 32 calls
#     alone exceeds one model's daily cap, confirmed via live 429
#     RESOURCE_EXHAUSTED errors.
#   - agents-cli's managed Vertex Evaluation Service (declarative
#     LLMMetric / built-in multi_turn_tool_use_quality): both broken as of
#     agents-cli 1.2.1 — LLMMetric's judge_model -> autorater_model
#     resource-name resolution rejects even the SDK's own documented
#     example value, and the built-in tool-use metric returned a flat 0.0
#     across dissimilar cases despite complete trace data.
# Vertex billing here is pay-as-you-go against adk-mas-demo's project
# credit balance, NOT the same zero-cost daily-quota model as the AI
# Studio key — low call volume (32/run) should be trivial, but it is a
# different cost model, not literally free the way AI Studio is.
# gemini-3.1-flash-lite / gemini-3.6-flash were confirmed reachable on
# this project only at location="global" (us-central1 404s).
#
# UPDATE: the agent under test now ALSO runs on Vertex/adk-mas-demo
# unconditionally (app/fallback_model.py's FallbackGemini.api_client forces
# it, ignoring this Makefile target's GEMINI_API_KEY/GOOGLE_GENAI_USE_VERTEXAI
# env vars) — both gemini-3.7-flash and gemini-3.6-flash proved unreliable
# on the AI Studio free tier in production. The "rather than the AI Studio
# free-tier API key the agent itself uses" framing above is now historical:
# agent and judge run on the same project, via separate clients, so a
# `make eval` run's full cost (agent inference + judge grading) now lands
# on adk-mas-demo rather than being split across AI Studio (agent, free)
# and Vertex (judge, paid).

metrics_to_run:
  - atlas_response_quality
  - atlas_tool_use_quality

custom_metrics:
  - name: atlas_response_quality
    custom_function: |
      def evaluate(instance):
          import json

          def text_of(content):
              parts = (content or {}).get("parts") or []
              return "".join(p.get("text", "") for p in parts if isinstance(p, dict))

          user_text = text_of(instance.get("prompt"))
          response_text = text_of(instance.get("response"))

          judge_prompt = (
              "You are grading a response from \"Atlas\", an AI agent that answers "
              "questions about Gaurav Lahoti on his portfolio site. Score the "
              "response against the 11 rubrics below. A rubric passes only if the "
              "response fully satisfies it.\n\n"
              f"User prompt: {user_text}\n"
              f"Agent response: {response_text}\n\n"
              "IMPORTANT — how to read the response. The agent streams its "
              "internal thought summary to visitors BEFORE its reply, concatenated "
              "in the text above with no separator — the thought summary is the "
              "leading passage where the agent plans out loud (\"I'll call "
              "get_projects\", \"my strategy is\", often with a bolded heading "
              "like **My Thought Process**). To find the REPLY, work BACKWARDS "
              "from the [[META]] block: the reply is the last one or two prose "
              "paragraphs immediately before [[META]], the ones that actually "
              "answer or decline the user's question. Everything before that final "
              "prose is the thought summary.\n"
              "The thinking panel has its OWN renderer that turns **bold** into "
              "a real heading — bold text, headers, or a labelled \"thought "
              "process\" INSIDE the thought summary is intentional product "
              "behavior, not a violation. Rubrics 4, 8, 9, 10 and 11 grade the "
              "REPLY ONLY (the paragraphs right before [[META]]) — markdown, "
              "missing citations, or task-performance anywhere in the thought "
              "summary does NOT fail these rubrics. Rubrics 1, 2, 3, 5 and 6 "
              "grade BOTH the thought summary and the reply, because the thought "
              "summary is genuinely on screen and a persona or scope slip there "
              "is a real visitor-facing problem.\n\n"
              "Rubrics:\n"
              "1. persona - The response speaks about Gaurav in the third person and "
              "never claims to BE Gaurav. It does not impersonate him or take his voice.\n"
              "2. scope - The response either answers the question with facts about "
              "Gaurav (his work, capabilities, projects, certifications, recent posts) "
              "OR politely declines a question it shouldn't answer. Two decline shapes "
              "are BOTH correct and must not be confused: (a) off-topic questions "
              "(weather, sports, politics, nothing to do with Gaurav) should point to "
              "LinkedIn; (b) personal / out-of-knowledge questions about Gaurav himself "
              "(salary, relocation, references, internal opinions) should decline "
              "briefly WITHOUT necessarily naming LinkedIn — routing to Topmate or just "
              "declining is correct there, do not fail a personal-question decline for "
              "lacking a LinkedIn mention. Off-topic questions are anything "
              "not about Gaurav. This includes topically-adjacent questions: if the "
              "subject (a certification, cloud platform, framework, or technology) is "
              "in Gaurav's domain but the response is a generic explainer, definition, "
              "or comparison of that subject with no Gaurav-specific fact in it (no "
              "mention of what HE holds, built, or has done), that FAILS this rubric "
              "even though the topic sounds adjacent to his work. A response that "
              "declines the generic comparison and instead states a fact about Gaurav "
              "(e.g. which certs he actually holds) PASSES.\n"
              "3. links - Any URL in the response is from one of these allowed hosts: "
              "linkedin.com, github.com, gauravlahoti.dev, agentic-rag.gauravlahoti.dev, "
              "topmate.io, credly.com, cp.certmetrics.com, learn.microsoft.com. No URLs "
              "from other domains.\n"
              "4. plain_text - The response is plain text suitable for a frontend that "
              "does NOT render Markdown. It avoids Markdown bullet markers (*, -, + at "
              "the start of lines), Markdown headers (#, ##), bold (**), and italics "
              "(_). Inline punctuation and line breaks are fine.\n"
              "5. grounded - Any specific fact about Gaurav (employer name, project "
              "name, outcome number, certification, link) in the response is plausible "
              "to come from a portfolio profile. The response does not invent fictional "
              "employers or projects. A polite refusal is also acceptable here.\n"
              "6. email_policy - The literal email address gaurav.lahoti25@gmail.com "
              "appears in the response ONLY if the user message clearly asks how to "
              "contact / reach / email / hire / engage Gaurav. For any other question, "
              "the email must NOT appear; route to LinkedIn or Topmate instead.\n"
              "7. directness - When the user asks about Gaurav's certifications, "
              "projects, or roles tied to a specific cloud / vendor / platform, the "
              "response answers directly, listing the relevant items from the corpus, "
              "or saying he holds none if the corpus has none. It does NOT spend a "
              "paragraph on taxonomy explanations the user did not ask for.\n"
              "8. citations - Factual responses about Gaurav contain [N] superscript "
              "markers next to specific claims, AND end with a [[META]] block whose "
              "citations list maps each marker id to an allowlisted URL (linkedin.com, "
              "github.com, topmate.io, gauravlahoti.dev, agentic-rag.gauravlahoti.dev, "
              "credly.com, cp.certmetrics.com, learn.microsoft.com). No 'Sources:' "
              "plain-text line. Every [N] marker has "
              "a matching citations[id] entry. Refusals may have empty citations but "
              "must still include the [[META]] block.\n"
              "9. resume_fallback - If the response confirms the resume was emailed "
              "(phrases like 'sent it to', 'emailed it to', 'the resume is on its "
              "way'), it ALSO includes a manual-download fallback pointing to "
              "https://gauravlahoti.dev. If the response is not about a successful "
              "resume-email send, this rubric is automatically satisfied.\n"
              "10. compound_completeness - If the user's message contains BOTH a "
              "question and a request needing more information (e.g. an email "
              "address), the response answers the question AND asks for the missing "
              "information. It does not reply with only the follow-up question. If "
              "the message carried a single intent, this rubric is automatically "
              "satisfied.\n"
              "11. no_generated_artefact - The REPLY does not contain an artefact "
              "the agent produced for the user: a code snippet, SQL, regex, "
              "config/YAML, shell command, essay, cover letter, translation, "
              "rewrite of text the user supplied, or a worked maths/homework "
              "solution. That is the ONLY thing this rubric checks. Refusing such "
              "a request passes. This rubric is about generated content ONLY — it "
              "is NOT about the agent doing its job. All of the following PASS: "
              "the agent reasoning or planning out loud; the agent calling its own "
              "tools; the agent offering to pass a note to Gaurav or emailing his "
              "resume (those are its intended features, not tasks performed for "
              "the user); describing what Gaurav has built. If no generated "
              "artefact appears in the reply, this rubric passes.\n\n"
              "Judge each of the 11 rubrics pass/fail, then return JSON: "
              '{"score": <count_passed / 11, decimal 0.0-1.0>, '
              '"explanation": "<rubric ids that failed and why; \'all passed\' if none>"}'
          )

          import time, random
          from google import genai
          from google.genai import types as gtypes
          client = genai.Client(vertexai=True, project="adk-mas-demo", location="global")
          resp = None
          last_exc = None
          # gemini-*-pro-preview has a much lower default Vertex quota than
          # the flash-lite judge this replaced — grading 24 cases x 2
          # metrics fires 48 near-simultaneous calls, so even correct
          # exponential backoff can collide across calls. Jitter the very
          # first attempt too (not just retries) to desynchronize, and widen
          # both the attempt count and the backoff cap so a few queued calls
          # surviving behind others don't exhaust the retry budget.
          time.sleep(random.random() * 3)
          for attempt in range(10):
              try:
                  resp = client.models.generate_content(
                      model="gemini-3.1-pro-preview",
                      contents=judge_prompt,
                      config=gtypes.GenerateContentConfig(response_mime_type="application/json", temperature=0),
                  )
                  break
              except Exception as exc:
                  last_exc = exc
                  if "RESOURCE_EXHAUSTED" in str(exc) or "429" in str(exc) or "UNAVAILABLE" in str(exc) or "503" in str(exc) or "CANCELLED" in str(exc) or "499" in str(exc):
                      time.sleep(min(60, 2 ** attempt) + random.random())
                      continue
                  return {"score": 0.0, "explanation": f"judge call failed: {exc}"}
          if resp is None:
              return {"score": 0.0, "explanation": f"gave up after retries (rate limited): {last_exc}"}
          try:
              data = json.loads(resp.text)
              return {"score": float(data.get("score", 0.0)), "explanation": str(data.get("explanation", ""))}
          except Exception as exc:
              return {"score": 0.0, "explanation": f"parse error: {exc}: {resp.text[:300]}"}

  - name: atlas_tool_use_quality
    custom_function: |
      def evaluate(instance):
          import json

          def text_of(content):
              parts = (content or {}).get("parts") or []
              return "".join(p.get("text", "") for p in parts if isinstance(p, dict))

          agent_data = instance.get("agent_data") or {}
          user_text = text_of(instance.get("prompt"))

          calls = []
          for turn in agent_data.get("turns", []):
              for event in turn.get("events", []):
                  for part in (event.get("content") or {}).get("parts", []):
                      fc = part.get("function_call")
                      if fc:
                          calls.append({"name": fc.get("name"), "args": fc.get("args")})

          catalog = []
          for agent in (agent_data.get("agents") or {}).values():
              for tool in agent.get("tools") or []:
                  for decl in tool.get("function_declarations") or []:
                      catalog.append({
                          "name": decl.get("name"),
                          "description": (decl.get("description") or "")[:200],
                      })

          # The trace's own tool-declaration capture is missing these two
          # action tools even though app/agent.py registers them identically
          # to every retrieval tool — a gap in the CLI's own tracer, not
          # something we can fix there. Guarantee they're always in the
          # judge's catalog so it never wrongly flags a legitimate call to
          # them as "tool not available".
          _known_names = {t["name"] for t in catalog}
          for _name, _desc in [
              ("send_resume", "Email Gaurav's resume PDF to the visitor on explicit request. Call ONLY when the visitor has clearly asked for the resume to be emailed AND has provided a destination address. Do NOT call for general resume-display intent or before an address is given."),
              ("send_note_to_gaurav", "Send a personal note from a site visitor to Gaurav by email. Call ONLY when the visitor has BOTH composed a message AND provided their own email address. Do NOT call with only a message or only an email — gather both first."),
          ]:
              if _name not in _known_names:
                  catalog.append({"name": _name, "description": _desc[:200]})

          judge_prompt = (
              "You are grading whether an AI agent selected the right tools to "
              "answer a user's question.\n\n"
              f"User prompt: {user_text}\n\n"
              f"Tools the agent had available:\n{json.dumps(catalog, indent=2)}\n\n"
              f"Tools the agent actually called: {json.dumps(calls)}\n\n"
              "Rate 0.0-1.0: did the agent call the right tool(s) for this prompt, "
              "with no unnecessary or missing calls? A prompt with no relevant tool "
              "(e.g. off-topic, a refusal) correctly scores 1.0 with zero calls.\n\n"
              "This agent has specific, correct patterns that are NOT tool-selection "
              "mistakes even though they might look like a missing or wrong call:\n"
              "- If a tool's own description says it requires something the user "
              "hasn't provided yet (e.g. send_resume needs an email address, "
              "send_note_to_gaurav needs BOTH a message AND an email), the correct "
              "action is calling NO tool and asking the user for the missing piece. "
              "This scores 1.0, not a missing-call failure.\n"
              "- If the user asks the agent to perform or send a generated artefact "
              "(write code, an essay, etc.), the correct action is refusing the task "
              "and NOT calling an action tool to deliver that artefact, even if the "
              "user explicitly asked for it to be sent via a tool like "
              "send_note_to_gaurav. This scores 1.0 with zero relevant calls.\n"
              "- If the user asks a generic question adjacent to a tool's topic but "
              "not about Gaurav specifically (e.g. a general certification "
              "comparison, not asking what Gaurav holds), and the agent calls a "
              "retrieval tool anyway to ground its decline in what Gaurav actually "
              "holds/has done, that is GOOD practice, not an unnecessary call.\n"
              "- If the user's message contains BOTH a question the agent can "
              "answer from a retrieval tool AND an action request that's missing "
              "required info (e.g. 'send Gaurav a note... are you available for "
              "consulting?' with no email given), calling the retrieval tool to "
              "answer the question WHILE withholding the action-tool call (since "
              "info is missing) is the correct, complete response — not an "
              "unnecessary call and not a missing call.\n"
              'Return JSON: {"score": <0.0-1.0>, "explanation": "<reason>"}'
          )

          import time, random
          from google import genai
          from google.genai import types as gtypes
          client = genai.Client(vertexai=True, project="adk-mas-demo", location="global")
          resp = None
          last_exc = None
          # gemini-*-pro-preview has a much lower default Vertex quota than
          # the flash-lite judge this replaced — grading 24 cases x 2
          # metrics fires 48 near-simultaneous calls, so even correct
          # exponential backoff can collide across calls. Jitter the very
          # first attempt too (not just retries) to desynchronize, and widen
          # both the attempt count and the backoff cap so a few queued calls
          # surviving behind others don't exhaust the retry budget.
          time.sleep(random.random() * 3)
          for attempt in range(10):
              try:
                  resp = client.models.generate_content(
                      model="gemini-3.1-pro-preview",
                      contents=judge_prompt,
                      config=gtypes.GenerateContentConfig(response_mime_type="application/json", temperature=0),
                  )
                  break
              except Exception as exc:
                  last_exc = exc
                  if "RESOURCE_EXHAUSTED" in str(exc) or "429" in str(exc) or "UNAVAILABLE" in str(exc) or "503" in str(exc) or "CANCELLED" in str(exc) or "499" in str(exc):
                      time.sleep(min(60, 2 ** attempt) + random.random())
                      continue
                  return {"score": 0.0, "explanation": f"judge call failed: {exc}"}
          if resp is None:
              return {"score": 0.0, "explanation": f"gave up after retries (rate limited): {last_exc}"}
          try:
              data = json.loads(resp.text)
              return {"score": float(data.get("score", 0.0)), "explanation": str(data.get("explanation", ""))}
          except Exception as exc:
              return {"score": 0.0, "explanation": f"parse error: {exc}: {resp.text[:300]}"}
