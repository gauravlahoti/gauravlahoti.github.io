  <line x1="580" y1="490" x2="467" y2="490" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="490" y="466" width="112" height="14" rx="3" fill="#000"/>
  <text x="546" y="477" class="edge-label" text-anchor="middle">grounded search</text>

  <!-- ⑦ Warden → GitHub (open PR). Warden bottom x=520 y=282 → down y=410 → to GitHub top x=590 (back off 7 → 423) -->
  <line x1="520" y1="282" x2="520" y2="410" stroke="#00FFD1" stroke-width="1.5"/>
  <line x1="520" y1="410" x2="590" y2="410" stroke="#00FFD1" stroke-width="1.5"/>
  <line x1="590" y1="410" x2="590" y2="423" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="526" y="386" width="98" height="14" rx="3" fill="#000"/>
  <text x="575" y="397" class="edge-label" text-anchor="middle">open PR / issue</text>

  <!-- ⑧ Warden → Resend MCP boundary. Warden bottom x=545 y=282 → down y=418 → right to x=820 → down to MCP boundary top y=440 (433) -->
  <line x1="545" y1="282" x2="545" y2="418" stroke="#00FFD1" stroke-width="1.5"/>
  <line x1="545" y1="418" x2="820" y2="418" stroke="#00FFD1" stroke-width="1.5"/>
  <line x1="820" y1="418" x2="820" y2="433" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="700" y="400" width="66" height="14" rx="3" fill="#000"/>
  <text x="733" y="411" class="edge-label" text-anchor="middle">MCP call</text>

  <!-- ⑨ Resend MCP → Summary Email. MCP top x=820 y=440 up ... route via right edge x=930 → Email bottom (820,171) -->
  <line x1="900" y1="480" x2="930" y2="480" stroke="#00FFD1" stroke-width="1.5"/>
  <line x1="930" y1="480" x2="930" y2="171" stroke="#00FFD1" stroke-width="1.5"/>
  <line x1="930" y1="171" x2="820" y2="171" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="852" y="300" width="90" height="14" rx="3" fill="#000"/>
  <text x="897" y="311" class="edge-label" text-anchor="middle">one summary</text>

  <!-- ═══ STEP CIRCLES ═══ -->

  <!-- ① horizontal (140,188)→(480,188) midpoint (310,188) -->
  <circle cx="310" cy="188" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="1"/>
  <text x="310" y="193" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="1">1</text>

  <!-- ② vertical (640,246)→(640,348) midpoint (640,297) -->
  <circle cx="640" cy="297" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="2"/>
  <text x="640" y="302" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="2">2</text>

  <!-- ③ horizontal (312,332)→(140,332) midpoint (226,332) -->
  <circle cx="226" cy="332" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="3"/>
  <text x="226" y="337" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="3">3</text>

  <!-- ④ horizontal (460,436)→(247,436) midpoint (353,436) -->
  <circle cx="353" cy="436" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="4"/>
  <text x="353" y="441" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="4">4</text>

  <!-- ⑤ horizontal (580,490)→(467,490) midpoint (523,490) -->
  <circle cx="523" cy="490" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="5"/>
  <text x="523" y="495" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="5">5</text>

  <!-- ⑥ vertical (520,282)→(520,410) midpoint (520,346) -->
  <circle cx="520" cy="346" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="6"/>
  <text x="520" y="351" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="6">6</text>

  <!-- ⑦ vertical (930,480)→(930,171) midpoint (930,325) -->
  <circle cx="930" cy="325" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="7"/>
  <text x="930" y="330" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="7">7</text>

  <!-- ═══ Animation flow data ═══ -->
  <g class="anim-data" style="display:none">
    <g data-traveler-path="140,164 140,188 480,188 480,189" data-color="#00FFD1" data-step="1" data-delay="0"/>
    <g data-traveler-path="580,246 640,246 640,348 683,348" data-color="#00FFD1" data-step="2" data-delay="0.7"/>
    <g data-traveler-path="312,332 140,332 140,315" data-color="#00FFD1" data-step="3" data-delay="1.4"/>
    <g data-traveler-path="460,364 460,436 247,436" data-color="#00FFD1" data-step="4" data-delay="2.1"/>
    <g data-traveler-path="580,364 580,490 467,490" data-color="#00FFD1" data-step="5" data-delay="2.8"/>
    <g data-traveler-path="520,282 520,410 590,410 590,423" data-color="#00FFD1" data-step="6" data-delay="3.5"/>
    <g data-traveler-path="545,282 545,418 820,418 820,433" data-color="#00FFD1" data-step="7" data-delay="4.2"/>
    <g data-traveler-path="900,480 930,480 930,171 820,171" data-color="#00FFD1" data-step="8" data-delay="4.9"/>
  </g>
</svg>
