<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" style="background:#000000">
  <defs>
    <style>
      text { font-family: 'Cascadia Code', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .node-title { font-size: 15px; fill: #E5E5E5; }
      .node-sub   { font-size: 11px; fill: #888888; }
      .edge-label { font-size: 11px; fill: #888888; }
      .caption    { font-size: 12px; fill: #555555; }
      .step-num   { font-size: 11px; font-weight: bold; }
    </style>
    <marker id="arr-acc" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#00FFD1"/>
    </marker>
  </defs>

  <!-- Caption -->
  <text x="40" y="52" class="caption">// atlas · adk · vertex ai · stt · tts · mcp · sse</text>

  <!-- ═══ BOUNDARIES ═══ -->

  <!-- Google Cloud outer boundary. The Browser sits OUTSIDE it — the voice
       capture and playback are client-side, not cloud. -->
  <rect x="380" y="66" width="870" height="704" rx="16" fill="none" stroke="#4285F4" stroke-width="1" opacity="0.35"/>
  <rect x="762" y="55" width="106" height="22" rx="2" fill="#000000"/>
  <image href="/diagram-icons/google-cloud.png" x="766" y="57" width="18" height="18"/>
  <text x="788" y="70" class="caption">Google Cloud</text>

  <!-- Cloud Run · atlas (holds all three HTTP routes) -->
  <rect x="430" y="118" width="400" height="427" rx="12" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="558" y="108" width="144" height="20" rx="2" fill="#000000"/>
  <image href="/diagram-icons/cloud-run.svg" x="562" y="110" width="14" height="14"/>
  <text x="579" y="122" class="caption">Cloud Run · atlas</text>

  <!-- Voice sub-group: these two routes bypass ADK entirely -->
  <rect x="452" y="158" width="356" height="206" rx="10" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="466" y="148" width="290" height="20" rx="2" fill="#000000"/>
  <text x="472" y="162" class="caption">voice routes · plain REST, no ADK loop</text>

  <!-- Vertex AI -->
  <rect x="900" y="118" width="330" height="427" rx="12" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="1018" y="108" width="94" height="20" rx="2" fill="#000000"/>
  <image href="/diagram-icons/gemini.png" x="1022" y="111" width="13" height="13"/>
  <text x="1040" y="122" class="caption">Vertex AI</text>

  <!-- ═══ NODES ═══ -->

  <!-- Browser (client) — x=40 y=126 200×419 -->
  <rect x="40" y="126" width="200" height="419" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <rect x="56" y="146" width="20" height="15" rx="2" fill="none" stroke="#888888" stroke-width="1.5"/>
  <line x1="56" y1="151" x2="76" y2="151" stroke="#888888" stroke-width="1"/>
  <text x="84" y="151" class="node-title">Browser</text>
  <text x="56" y="176" class="node-sub">client · no keys, no models</text>

  <!-- mic chip (aligned to the transcribe lane) -->
  <rect x="56" y="190" width="168" height="66" rx="6" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <path d="M78 205 a6 6 0 0 1 12 0 v10 a6 6 0 0 1 -12 0 z" fill="none" stroke="#888888" stroke-width="1.5"/>
  <path d="M73 216 a11 11 0 0 0 22 0" fill="none" stroke="#888888" stroke-width="1.5"/>
  <line x1="84" y1="227" x2="84" y2="233" stroke="#888888" stroke-width="1.5"/>
  <text x="104" y="213" class="node-title" style="font-size:13px">mic</text>
  <text x="104" y="230" class="node-sub">MediaRecorder</text>
  <text x="66" y="248" class="node-sub">opus · 30 s cap</text>

  <!-- speaker chip (aligned to the speak lane) -->
  <rect x="56" y="276" width="168" height="66" rx="6" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <path d="M75 296 h6 l8 -7 v22 l-8 -7 h-6 z" fill="none" stroke="#888888" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M93 294 a7 7 0 0 1 0 14" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="110" y="299" class="node-title" style="font-size:13px">speaker</text>
  <text x="110" y="316" class="node-sub">Web Audio API</text>
  <text x="66" y="334" class="node-sub">opt-in · consent card</text>

  <!-- divider: voice I/O above, chat below (mirrors the split in the Cloud Run column) -->
  <line x1="56" y1="384" x2="224" y2="384" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>

  <!-- composer chip (aligned to the chat lane) -->
  <rect x="56" y="425" width="168" height="100" rx="6" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="74" y="447" width="20" height="16" rx="3" fill="none" stroke="#888888" stroke-width="1.5"/>
  <line x1="79" y1="453" x2="89" y2="453" stroke="#888888" stroke-width="1"/>
  <line x1="79" y1="458" x2="86" y2="458" stroke="#888888" stroke-width="1"/>
  <text x="104" y="452" class="node-title" style="font-size:13px">composer</text>
  <text x="104" y="468" class="node-sub">SSE client</text>
  <text x="66" y="491" class="node-sub">a human keystroke</text>
  <text x="66" y="508" class="node-sub">always sends</text>

  <!-- /api/agent-transcribe — x=468 y=190 330×66 -->
  <rect x="468" y="190" width="330" height="66" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <text x="486" y="216" class="node-title">/api/agent-transcribe</text>
  <text x="486" y="236" class="node-sub">FastAPI + httpx · voice bucket 12/day</text>

  <!-- /api/agent-speak — x=468 y=276 330×66 -->
  <rect x="468" y="276" width="330" height="66" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <text x="486" y="302" class="node-title">/api/agent-speak</text>
  <text x="486" y="322" class="node-sub">one call per sentence · speak bucket 40/day</text>

  <!-- ADK Agent — x=452 y=425 356×100 -->
  <rect x="452" y="425" width="356" height="100" rx="8" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5"/>
  <image href="/diagram-icons/adk.png" x="470" y="454" width="26" height="26"/>
  <text x="506" y="455" class="node-title">ADK Agent</text>
  <text x="506" y="474" class="node-sub">/api/agent-chat · SSE</text>
  <text x="506" y="492" class="node-sub">9 tools · orchestrator</text>
  <text x="470" y="512" class="node-sub">chat bucket 4/day</text>

  <!-- Vertex model chips -->
  <rect x="922" y="190" width="286" height="66" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <image href="/diagram-icons/gemini.png" x="940" y="206" width="14" height="14"/>
  <text x="960" y="217" class="node-title" style="font-size:14px">Gemini 3.5 Transcribe</text>
  <text x="940" y="238" class="node-sub">SMART mode · custom vocabulary</text>

  <rect x="922" y="276" width="286" height="66" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <image href="/diagram-icons/gemini.png" x="940" y="292" width="14" height="14"/>
  <text x="960" y="303" class="node-title" style="font-size:14px">Gemini 3.1 Flash TTS</text>
  <text x="940" y="324" class="node-sub">voice Charon · 24 kHz PCM</text>

  <rect x="922" y="425" width="286" height="100" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <image href="/diagram-icons/gemini.png" x="940" y="452" width="14" height="14"/>
  <text x="960" y="463" class="node-title" style="font-size:14px">Gemini 3.7 Flash</text>
  <text x="940" y="486" class="node-sub">cascades to 3.6 Flash</text>
  <text x="940" y="504" class="node-sub">on 429 / 503</text>

  <!-- ADK Skills — x=440 y=620 220×110 -->
  <rect x="440" y="620" width="220" height="110" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <ellipse cx="465" cy="646" rx="9" ry="4" fill="none" stroke="#888888" stroke-width="1.5"/>
  <rect x="456" y="646" width="18" height="10" fill="none" stroke="#888888" stroke-width="1.5"/>
  <ellipse cx="465" cy="656" rx="9" ry="4" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="486" y="647" class="node-title">ADK Skills</text>
  <text x="486" y="665" class="node-sub">profile · projects</text>
  <text x="456" y="686" class="node-sub">posts · certs · agents</text>
  <text x="456" y="704" class="node-sub">live JSON, no redeploy</text>

  <!-- Resend MCP Cloud Run boundary -->
  <rect x="940" y="612" width="260" height="126" rx="10" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="1022" y="602" width="96" height="20" rx="2" fill="#000000"/>
  <image href="/diagram-icons/cloud-run.svg" x="1026" y="604" width="14" height="14"/>
  <text x="1043" y="616" class="caption">Cloud Run</text>

  <!-- Resend MCP — x=956 y=620 228×110 -->
  <rect x="956" y="620" width="228" height="110" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <rect x="972" y="640" width="28" height="28" rx="7" fill="rgba(136,136,136,0.18)"/>
  <rect x="977" y="645" width="10" height="14" rx="2" fill="none" stroke="#888888" stroke-width="1.5"/>
  <line x1="979" y1="645" x2="979" y2="640" stroke="#888888" stroke-width="1.5"/>
  <line x1="985" y1="645" x2="985" y2="640" stroke="#888888" stroke-width="1.5"/>
  <text x="1010" y="647" class="node-title">Resend MCP</text>
  <text x="1010" y="665" class="node-sub">Node.js · Cloud Run</text>
  <text x="972" y="688" class="node-sub">send-email tool</text>
  <text x="972" y="706" class="node-sub">agent holds no keys</text>

  <!-- ═══ EDGES ═══ -->

  <!-- ① Browser mic → /api/agent-transcribe -->
  <line x1="240" y1="206" x2="466" y2="206" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="272" y="188" width="96" height="14" rx="3" fill="#000000"/>
  <text x="320" y="199" class="edge-label" text-anchor="middle">audio clip</text>

  <!-- ② transcript back → composer (never auto-sends) -->
  <line x1="468" y1="240" x2="244" y2="240" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="272" y="222" width="96" height="14" rx="3" fill="#000000"/>
  <text x="320" y="233" class="edge-label" text-anchor="middle">transcript</text>

  <!-- ⑥ reply chunks → /api/agent-speak -->
  <line x1="240" y1="292" x2="466" y2="292" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="266" y="274" width="108" height="14" rx="3" fill="#000000"/>
  <text x="320" y="285" class="edge-label" text-anchor="middle">reply chunks</text>

  <!-- ⑦ WAV back → Web Audio -->
  <line x1="468" y1="326" x2="244" y2="326" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="272" y="308" width="96" height="14" rx="3" fill="#000000"/>
  <text x="320" y="319" class="edge-label" text-anchor="middle">WAV audio</text>

  <!-- ③ composer → ADK Agent (SSE) -->
  <line x1="240" y1="451" x2="450" y2="451" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="296" y="433" width="48" height="14" rx="3" fill="#000000"/>
  <text x="320" y="444" class="edge-label" text-anchor="middle">SSE</text>

  <!-- ⑤ reply streams back -->
  <line x1="452" y1="499" x2="244" y2="499" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="272" y="481" width="96" height="14" rx="3" fill="#000000"/>
  <text x="320" y="492" class="edge-label" text-anchor="middle">stream back</text>

  <!-- transcribe → STT model -->
  <line x1="798" y1="223" x2="918" y2="223" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="840" y="205" width="36" height="14" rx="3" fill="#000000"/>
  <text x="858" y="216" class="edge-label" text-anchor="middle">STT</text>

  <!-- speak → TTS model -->
  <line x1="798" y1="309" x2="918" y2="309" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="840" y="291" width="36" height="14" rx="3" fill="#000000"/>
  <text x="858" y="302" class="edge-label" text-anchor="middle">TTS</text>

  <!-- agent → reasoning model -->
  <line x1="808" y1="475" x2="918" y2="475" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="832" y="457" width="62" height="14" rx="3" fill="#000000"/>
  <text x="863" y="468" class="edge-label" text-anchor="middle">inference</text>

  <!-- ④ agent → ADK Skills -->
  <line x1="520" y1="525" x2="520" y2="616" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="530" y="596" width="62" height="14" rx="3" fill="#000000"/>
  <text x="561" y="607" class="edge-label" text-anchor="middle">retrieval</text>

  <!-- agent → Resend MCP -->
  <line x1="740" y1="525" x2="740" y2="580" stroke="#00FFD1" stroke-width="1.5"/>
  <line x1="740" y1="580" x2="1070" y2="580" stroke="#00FFD1" stroke-width="1.5"/>
  <line x1="1070" y1="580" x2="1070" y2="608" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="846" y="560" width="66" height="14" rx="3" fill="#000000"/>
  <text x="879" y="571" class="edge-label" text-anchor="middle">MCP call</text>

  <!-- ═══ STEP CIRCLES ═══ -->

  <circle cx="400" cy="206" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="1"/>
  <text x="400" y="211" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="1">1</text>

  <circle cx="400" cy="240" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="2"/>
  <text x="400" y="245" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="2">2</text>

  <circle cx="400" cy="451" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="3"/>
  <text x="400" y="456" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="3">3</text>

  <circle cx="520" cy="572" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="4"/>
  <text x="520" y="577" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="4">4</text>

  <circle cx="400" cy="499" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="5"/>
  <text x="400" y="504" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="5">5</text>

  <circle cx="400" cy="292" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="6"/>
  <text x="400" y="297" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="6">6</text>

  <circle cx="400" cy="326" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="7"/>
  <text x="400" y="331" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="7">7</text>

  <!-- ═══ Animation flow data ═══ -->
  <g class="anim-data" style="display:none">
    <!-- voice in -->
    <g data-traveler-path="240,206 466,206" data-color="#00FFD1" data-step="1" data-delay="0"/>
    <g data-traveler-path="798,223 918,223" data-color="#00FFD1" data-delay="0.5"/>
    <g data-traveler-path="468,240 244,240" data-color="#00FFD1" data-step="2" data-delay="1.0"/>
    <!-- chat -->
    <g data-traveler-path="240,451 450,451" data-color="#00FFD1" data-step="3" data-delay="1.7"/>
    <g data-traveler-path="808,475 918,475" data-color="#00FFD1" data-delay="2.2"/>
    <g data-traveler-path="520,525 520,616" data-color="#00FFD1" data-step="4" data-delay="2.6"/>
    <g data-traveler-path="740,525 740,580 1070,580 1070,608" data-color="#00FFD1" data-delay="3.0"/>
    <g data-traveler-path="452,499 244,499" data-color="#00FFD1" data-step="5" data-delay="3.4"/>
    <!-- voice out -->
    <g data-traveler-path="240,292 466,292" data-color="#00FFD1" data-step="6" data-delay="3.8"/>
    <g data-traveler-path="798,309 918,309" data-color="#00FFD1" data-delay="4.2"/>
    <g data-traveler-path="468,326 244,326" data-color="#00FFD1" data-step="7" data-delay="4.7"/>
  </g>
</svg>
