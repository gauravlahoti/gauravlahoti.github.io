<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 690" width="1280" height="690" style="background:#000000">
  <!-- Agentic Harness: the harness is the box around the model. Inside: what the model
       reads (context), what it keeps (memory), a check on the way in, and guardrails, tools
       and verification on the way out. Step circles follow the seven steps in agents.json;
       agents-page.js animates the travelers. -->
  <defs>
    <style>
      text { font-family: 'Cascadia Code', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .node-title { font-size: 15px; fill: #E5E5E5; }
      .node-sub   { font-size: 11px; fill: #888888; }
      .chip       { font-size: 11px; }
      .edge-label { font-size: 11px; fill: #888888; }
      .caption    { font-size: 12px; fill: #555555; }
      .harness    { font-size: 12px; fill: #00FFD1; letter-spacing: 0.18em; }
      .step-num   { font-size: 11px; font-weight: bold; }
    </style>
    <marker id="arr-std" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#555555"/>
    </marker>
    <marker id="arr-acc" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#00FFD1"/>
    </marker>
  </defs>

  <text x="40" y="40" class="caption">// agentic-harness · plain Python on Cloud Run · the parts around the model</text>
  <rect x="220" y="80" width="840" height="560" rx="14" fill="rgba(0,255,209,0.025)" stroke="#00FFD1" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="6 4"/>
  <rect x="560" y="70" width="160" height="20" rx="3" fill="#000000"/>
  <text x="640" y="84" class="harness" text-anchor="middle">THE HARNESS</text>

  <!-- Task -->
  <rect x="40" y="320" width="150" height="80" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <text x="92" y="346" class="node-title">Task</text>
  <text x="92" y="363" class="node-sub">you ask</text>
  <rect x="56" y="334" width="28" height="28" rx="7" fill="rgba(136,136,136,0.18)"/>
  <circle cx="70" cy="343" r="3.5" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M63 356 a7 6 0 0 1 14 0" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Answer -->
  <rect x="1090" y="510" width="150" height="80" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <text x="1142" y="536" class="node-title">Answer</text>
  <text x="1142" y="553" class="node-sub">and its cost</text>
  <rect x="1106" y="524" width="28" height="28" rx="7" fill="rgba(136,136,136,0.18)"/>
  <rect x="1112" y="532" width="16" height="12" rx="2" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1112 533 l8 6 l8 -6" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Context -->
  <rect x="480" y="110" width="320" height="120" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <text x="532" y="136" class="node-title">Context</text>
  <text x="532" y="153" class="node-sub">what the model reads</text>
  <rect x="496" y="124" width="28" height="28" rx="7" fill="rgba(136,136,136,0.18)"/>
  <path d="M510 130 l8 4 l-8 4 l-8 -4 z" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M502 138 l8 4 l8 -4 M502 142 l8 4 l8 -4" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="496" y="186" width="104" height="24" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="548" y="202" class="chip" fill="#E5E5E5" text-anchor="middle">Instructions</text>
  <rect x="608" y="186" width="88" height="24" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="652" y="202" class="chip" fill="#E5E5E5" text-anchor="middle">Team file</text>
  <rect x="704" y="186" width="80" height="24" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="744" y="202" class="chip" fill="#E5E5E5" text-anchor="middle">Skills</text>

  <!-- Memory -->
  <rect x="480" y="490" width="320" height="120" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <text x="532" y="516" class="node-title">Memory</text>
  <text x="532" y="533" class="node-sub">what it keeps</text>
  <rect x="496" y="504" width="28" height="28" rx="7" fill="rgba(136,136,136,0.18)"/>
  <ellipse cx="510" cy="511" rx="7" ry="2.5" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M503 511 v12 a7 2.5 0 0 0 14 0 v-12 M503 517 a7 2.5 0 0 0 14 0" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="496" y="552" width="140" height="42" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="566" y="570" class="chip" fill="#E5E5E5" text-anchor="middle">Short-term</text>
  <text x="566" y="585" class="node-sub" text-anchor="middle">this chat</text>
  <rect x="644" y="552" width="140" height="42" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="714" y="570" class="chip" fill="#E5E5E5" text-anchor="middle">Long-term</text>
  <text x="714" y="585" class="node-sub" text-anchor="middle">team facts</text>

  <!-- Input check -->
  <rect x="250" y="305" width="200" height="110" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <text x="302" y="331" class="node-title">Input check</text>
  <text x="302" y="348" class="node-sub">before the model</text>
  <rect x="266" y="319" width="28" height="28" rx="7" fill="rgba(136,136,136,0.18)"/>
  <path d="M280 324 l7 3 v5 c0 4 -3 7 -7 8 c-4 -1 -7 -4 -7 -8 v-5 z" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="266" y="371" width="76" height="24" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="304" y="387" class="chip" fill="#E5E5E5" text-anchor="middle">On topic</text>
  <rect x="350" y="371" width="84" height="24" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="392" y="387" class="chip" fill="#E5E5E5" text-anchor="middle">Injection</text>

  <!-- Model -->
  <rect x="520" y="305" width="240" height="110" rx="8" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5"/>
  <g transform="translate(23.5 24)">
  <text x="572" y="331" class="node-title">Model</text>
  <text x="572" y="348" class="node-sub">Claude 5.x Family</text>
  <g stroke="#D97757" stroke-width="1.5">
    <line x1="550" y1="322" x2="550" y2="344"/>
    <line x1="539" y1="333" x2="561" y2="333"/>
    <line x1="542" y1="325" x2="558" y2="341"/>
    <line x1="558" y1="325" x2="542" y2="341"/>
  </g>
  </g>

  <!-- Guardrails -->
  <rect x="830" y="110" width="200" height="120" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <text x="882" y="136" class="node-title">Guardrails</text>
  <text x="882" y="153" class="node-sub">before it acts</text>
  <rect x="846" y="124" width="28" height="28" rx="7" fill="rgba(136,136,136,0.18)"/>
  <path d="M860 129 l7 3 v5 c0 4 -3 7 -7 8 c-4 -1 -7 -4 -7 -8 v-5 z" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M857 137 l2 2 l4 -4" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="846" y="186" width="76" height="24" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="884" y="202" class="chip" fill="#E5E5E5" text-anchor="middle">Rules</text>
  <rect x="930" y="186" width="84" height="24" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="972" y="202" class="chip" fill="#E5E5E5" text-anchor="middle">Approvals</text>

  <!-- Tools -->
  <rect x="830" y="305" width="200" height="110" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <text x="882" y="331" class="node-title">Tools</text>
  <text x="882" y="348" class="node-sub">the harness runs</text>
  <rect x="846" y="319" width="28" height="28" rx="7" fill="rgba(136,136,136,0.18)"/>
  <path d="M856 327 l-4 6 l4 6 M864 327 l4 6 l-4 6" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="846" y="357" width="80" height="22" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="886" y="372" class="chip" fill="#E5E5E5" text-anchor="middle">Look up</text>
  <rect x="934" y="357" width="80" height="22" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="974" y="372" class="chip" fill="#E5E5E5" text-anchor="middle">Draft</text>
  <rect x="846" y="385" width="80" height="22" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="886" y="400" class="chip" fill="#E5E5E5" text-anchor="middle">Send</text>
  <rect x="934" y="385" width="80" height="22" rx="5" fill="#111111" stroke="#00FFD1" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="974" y="400" class="chip" fill="#00FFD1" text-anchor="middle">Sub-agent</text>

  <!-- Verify -->
  <rect x="830" y="490" width="200" height="120" rx="8" fill="#0F0F0F" stroke="#555555" stroke-width="1.5"/>
  <text x="882" y="516" class="node-title">Verify</text>
  <text x="882" y="533" class="node-sub">before you see it</text>
  <rect x="846" y="504" width="28" height="28" rx="7" fill="rgba(136,136,136,0.18)"/>
  <circle cx="860" cy="518" r="8" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M856 518 l3 3 l5 -6" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="846" y="566" width="80" height="24" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="886" y="582" class="chip" fill="#E5E5E5" text-anchor="middle">5 checks</text>
  <rect x="934" y="566" width="80" height="24" rx="5" fill="#111111" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <text x="974" y="582" class="chip" fill="#E5E5E5" text-anchor="middle">1 retry</text>

  <!-- Edges -->
  <polyline points="190,360 243,360" fill="none" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <polyline points="450,360 513,360" fill="none" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <polyline points="640,230 640,298" fill="none" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="660.25" y="252" width="43.5" height="15" rx="3" fill="#000000"/>
  <text x="682" y="263" class="edge-label" text-anchor="middle">reads</text>
  <polyline points="760,330 805,330 805,170 823,170" fill="none" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <polyline points="930,230 930,298" fill="none" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <rect x="937.55" y="255" width="56.9" height="15" rx="3" fill="#000000"/>
  <text x="966" y="266" class="edge-label" text-anchor="middle">allowed</text>
  <polyline points="830,372 767,372" fill="none" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <polyline points="760,398 815,398 815,550 823,550" fill="none" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <polyline points="1030,550 1083,550" fill="none" stroke="#00FFD1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <polyline points="640,415 640,483" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arr-std)"/>
  <rect x="656.25" y="440" width="43.5" height="15" rx="3" fill="#000000"/>
  <text x="678" y="451" class="edge-label" text-anchor="middle">saves</text>
  <polyline points="480,550 465,550 465,170 473,170" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arr-std)"/>
  <rect x="439.9" y="445" width="50.2" height="15" rx="3" fill="#000000"/>
  <text x="465" y="456" class="edge-label" text-anchor="middle">recall</text>
  <rect x="769.85" y="290" width="70.3" height="15" rx="3" fill="#000000"/>
  <text x="805" y="301" class="edge-label" text-anchor="middle">tool call</text>
  <rect x="772.9" y="382" width="50.2" height="15" rx="3" fill="#000000"/>
  <text x="798" y="393" class="edge-label" text-anchor="middle">result</text>
  <rect x="793.25" y="470" width="43.5" height="15" rx="3" fill="#000000"/>
  <text x="815" y="481" class="edge-label" text-anchor="middle">draft</text>
  <rect x="1036.9" y="562" width="50.2" height="15" rx="3" fill="#000000"/>
  <text x="1062" y="573" class="edge-label" text-anchor="middle">passes</text>

  <!-- Step circles -->
  <circle cx="640" cy="272" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="1"/>
  <text x="640" y="276" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="1">1</text>
  <circle cx="805" cy="230" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="2"/>
  <text x="805" y="234" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="2">2</text>
  <circle cx="796" cy="372" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="3"/>
  <text x="796" y="376" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="3">3</text>
  <circle cx="1045" cy="396" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="4"/>
  <text x="1045" y="400" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="4">4</text>
  <circle cx="815" cy="520" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="5"/>
  <text x="815" y="524" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="5">5</text>
  <circle cx="1016" cy="124" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="6"/>
  <text x="1016" y="128" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="6">6</text>
  <circle cx="1045" cy="550" r="11" fill="#0E1A19" stroke="#00FFD1" stroke-width="1.5" data-step-circle="7"/>
  <text x="1045" y="554" class="step-num" text-anchor="middle" fill="#00FFD1" data-step-circle="7">7</text>

  <!-- Animation flow data -->
  <g class="anim-data" style="display:none">
    <g data-traveler-path="190,360 243,360" data-color="#00FFD1" data-delay="0"/>
    <g data-traveler-path="450,360 513,360" data-color="#00FFD1" data-delay="0.6"/>
    <g data-traveler-path="640,230 640,298" data-color="#00FFD1" data-step="1" data-delay="1.2"/>
    <g data-traveler-path="760,330 805,330 805,170 823,170" data-color="#00FFD1" data-step="2" data-delay="1.8"/>
    <g data-traveler-path="930,230 930,298" data-color="#00FFD1" data-step="6" data-delay="2.6"/>
    <g data-traveler-path="830,372 767,372" data-color="#00FFD1" data-step="3" data-delay="3.3"/>
    <g data-traveler-path="640,415 640,483" data-color="#888888" data-delay="3.9"/>
    <g data-traveler-path="480,550 465,550 465,170 473,170" data-color="#888888" data-delay="4.5"/>
    <g data-traveler-path="760,398 815,398 815,550 823,550" data-color="#00FFD1" data-step="5" data-delay="5.2"/>
    <g data-traveler-path="1030,550 1083,550" data-color="#00FFD1" data-step="7" data-delay="6"/>
  </g>
</svg>
